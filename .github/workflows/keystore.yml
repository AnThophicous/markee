name: Gerar chave de assinatura

# Roda UMA vez. O resultado vira o segredo ANDROID_KEYSTORE_BASE64, e a partir
# daí todo APK sai com a mesma assinatura — que é o que permite instalar por
# cima do anterior sem desinstalar e perder os dados.
#
# O alias e a senha são exatamente os que o template do Expo espera no
# `debug.keystore`, de propósito: assim o arquivo entra no lugar do gerado
# automaticamente, sem precisar remendar o build.gradle.
#
# Isto serve para o APK que se instala à mão. Publicar na Play Store pede uma
# chave de verdade, com senha própria e guardada fora do repositório.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar
        run: |
          keytool -genkeypair -v \
            -keystore markee.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Markee, OU=Markee, O=Markee, L=Sao Paulo, S=SP, C=BR"
          base64 -w0 markee.keystore > keystore.base64
          keytool -list -keystore markee.keystore -storepass android | grep -i sha256

      # Sai como artefato, não impresso no log: o log de Actions fica visível a
      # quem tem acesso ao repositório e não expira junto com o artefato.
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.base64
          retention-days: 1
