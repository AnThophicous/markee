name: APK Android

# Manual, ou a cada push na main. `workflow_dispatch` permite recompilar sem
# precisar inventar um commit.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Tipo de build
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']

concurrency:
  # Push em cima de push cancela o anterior — não adianta compilar código velho.
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # No job inteiro, e não em um passo só, de propósito.
    #
    # Estas duas variáveis não são lidas quando o app abre: o babel-preset-expo
    # troca `process.env.EXPO_PUBLIC_*` pelo valor literal enquanto compila. E
    # quem compila o JavaScript é a tarefa do Gradle, lá embaixo — não o
    # `expo prebuild`, que apenas gera a pasta android/.
    #
    # Elas já estiveram declaradas somente no passo do prebuild. O build passava,
    # o APK era publicado, e ele fechava sozinho na primeira tela, porque o valor
    # gravado tinha sido `undefined`. Declarar aqui em cima é o que garante que
    # o passo certo enxergue as variáveis.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, e não 20, por causa do db-test.js: ele roda as migrações num
          # SQLite de verdade usando `node:sqlite`, que só existe a partir do
          # Node 22.5. No Node 20 o teste morre com ERR_UNKNOWN_BUILTIN_MODULE.
          node-version: 22
          cache: npm

      # O Gradle do Android precisa de JDK 17. O runner traz vários, então a
      # versão é fixada para o build não mudar de comportamento sozinho.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        # O .npmrc do projeto já traz legacy-peer-deps, necessário por causa do
        # conflito de peer entre expo-router e react-dom.
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Linter
        # A regra que justifica este passo é a react-hooks/rules-of-hooks: hook
        # dentro de condição vira "Rendered fewer hooks than expected" e derruba
        # a tela, mas só no caminho que dispara a condição — o tipo de defeito
        # que passa despercebido em teste manual. Avisos não param o build.
        run: npm run lint

      - name: Conferir se o servidor vai entrar no pacote
        # Não basta perguntar se o segredo existe: isto compila o
        # src/services/supabase.ts do mesmo jeito que o build de release compila
        # e confere o que ficou gravado na variável. É a diferença entre "a
        # variável está definida no runner" e "o endereço está dentro do APK".
        run: node scripts/env-check.js

      - name: Testes que rodam sem aparelho
        # QR (conferido contra a norma), criptografia ponta a ponta, calculadora
        # (que avalia texto do modelo), laço de ferramentas, registro de quedas,
        # conversão markdown↔blocos, geometria dos gráficos, migrações do banco
        # local, legibilidade das cores de cargo, a faixa de avisos, a paleta, a
        # navegação, o carrossel, a separação da aula, a revisão espaçada e a
        # ofensiva, o extrato de crédito, as ferramentas de escrita da IA, o
        # corte da aula gravada, as medalhas, os emblemas e efeitos, as
        # conquistas de ofensiva, os afiliados e as ligações entre notas.
        #
        # Os que mais pegam defeito silencioso: a conversão instável faria a nota
        # mudar sozinha a cada abertura; um NaN na geometria faz o gráfico sumir
        # sem erro nenhum; uma migração quebrada abre o app com o banco pela
        # metade; uma cor de cargo sem contraste some no fundo sem avisar; e um
        # SM-2 sem piso de facilidade faz a mesma carta voltar todo dia para
        # sempre, o que só aparece semanas depois de o app estar em uso.
        #
        # Três dos novos conferem listas escritas em DOIS lugares, que é a
        # família de defeito mais chata deste projeto: um efeito que existe no
        # TypeScript e não na whitelist do banco faz o salvamento falhar na cara
        # da pessoa; um que existe nos dois mas ninguém desenhou salva certo e
        # não aparece — sem erro nenhum para investigar. O de afiliados lê o SQL
        # atrás de concessão a mais: um `grant execute` em record_pro_purchase e
        # qualquer conta passa a poder se dar comissão.
        #
        # O worklets-test é o mais importante da lista, e nasceu de um app que
        # não abria. O Reanimated roda `useAnimatedStyle` e os retornos de gesto
        # num runtime separado, na thread de UI; chamar de lá uma função sem a
        # diretiva 'worklet' encerra o processo. TypeScript aprova, ESLint
        # aprova, e os 33 testes da matemática do carrossel passam — em Node não
        # existe thread de UI. O defeito só aparece no aparelho, e como o
        # carrossel é a tela inicial, aparecia como "Markee parou", sem mais
        # nada. Três lugares estavam assim: o carrossel, o arrastar de qualquer
        # folha e o arrastar de nota na lista.
        #
        # Falhar aqui para o build antes de gastar 15 minutos compilando.
        run: |
          node scripts/qr-test.js
          node scripts/e2e-test.js
          node scripts/calc-test.js
          node scripts/agent-test.js
          node scripts/crash-test.js
          node scripts/blocks-test.js
          node scripts/chart-test.js
          node scripts/db-test.js
          node scripts/role-color-test.js
          node scripts/avisos-test.js
          node scripts/theme-test.js
          node scripts/nav-test.js
          node scripts/carousel-test.js
          node scripts/classify-test.js
          node scripts/review-test.js
          node scripts/credits-test.js
          node scripts/ai-write-test.js
          node scripts/record-test.js
          node scripts/medals-test.js
          node scripts/emblemas-test.js
          node scripts/ofensiva-test.js
          node scripts/afiliados-test.js
          node scripts/ligacoes-test.js
          node scripts/worklets-test.js

      - name: Gerar o projeto Android
        # A pasta android/ não fica no repositório: é derivada do app.json e dos
        # plugins. Gerar a cada build evita que ela envelheça em silêncio.
        run: npx expo prebuild --platform android --clean --no-install

      - name: Enxugar o APK
        # O prebuild empacota QUATRO arquiteturas num APK só: arm64-v8a,
        # armeabi-v7a, x86 e x86_64. As duas de x86 só existem em emulador, e
        # armeabi-v7a é para aparelhos de 32 bits (anteriores a ~2015).
        #
        # O peso de um app React Native está nas bibliotecas nativas (.so), uma
        # cópia por arquitetura — por isso cortar aqui vale muito mais do que
        # encolher o código Java, que é uma fatia pequena do total.
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep '^reactNativeArchitectures' android/gradle.properties

      - name: Usar a nossa chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # O template do Expo assina o release com `signingConfigs.debug`, e o
        # debug.keystore é gerado do zero a cada prebuild — por isso a assinatura
        # mudaria todo build e o Android recusaria a atualização com "app não
        # instalado".
        #
        # Em vez de remendar o build.gradle com regex (frágil, quebra quando o
        # template do Expo muda), o arquivo é simplesmente substituído pelo
        # nosso, com o mesmo alias e senha que o template espera. O Gradle nem
        # percebe a diferença.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64 — assinatura descartável."
            echo "::warning::Para instalar por cima depois, será preciso desinstalar antes."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android | grep -i 'sha-256' || true

      - name: Compilar
        working-directory: android
        # O Gradle baixa o NDK sozinho ao configurar o :expo-sqlite, e quando
        # esse download vem truncado ele morre com "Archive is not a ZIP
        # archive" — build inteiro perdido por um arquivo corrompido na rede do
        # runner, sem nenhuma relação com o código. Foi o que derrubou o build
        # de 29/07.
        #
        # Baixar o NDK antes não resolveria: a versão não está em arquivo nenhum
        # do projeto (o `app/build.gradle` lê `rootProject.ext.ndkVersion`, que
        # o plugin do Expo preenche com o padrão do Android Gradle Plugin, em
        # tempo de build). Não há o que ler para saber o que baixar.
        #
        # Então a segunda tentativa é CONDICIONADA à assinatura da falha. Repetir
        # sempre custaria trinta minutos para reportar um erro de código de
        # verdade; repetir só quando o log traz o zip corrompido custa nada no
        # caso normal e conserta exatamente o caso que aconteceu.
        run: |
          ALVO='${{ github.event.inputs.variant == 'debug' && 'assembleDebug' || 'assembleRelease' }}'
          LOG=$(mktemp)

          set +e
          ./gradlew "$ALVO" --no-daemon 2>&1 | tee "$LOG"
          CODIGO=${PIPESTATUS[0]}
          set -e

          if [ "$CODIGO" -eq 0 ]; then exit 0; fi

          if ! grep -qE 'not a ZIP archive|InstallFailedException|Error on ZipFile' "$LOG"; then
            echo "::error::A compilação falhou por um motivo que não é o download do NDK."
            exit "$CODIGO"
          fi

          echo "::warning::O NDK veio corrompido. Apagando o pedaço baixado e compilando de novo."
          # O pedaço truncado precisa sair: com o diretório no lugar, o
          # sdkmanager considera a instalação boa e não baixa de novo.
          rm -rf "$ANDROID_HOME"/ndk/* "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"

          ./gradlew "$ALVO" --no-daemon

      - name: Nomear com a data e o commit
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          NAME="markee-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          cp "$SRC" "$NAME.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME.apk"

      - name: Confirmar o endereço dentro do APK
        # Confirmação secundária, olhando o arquivo que a pessoa vai instalar.
        # O portão de verdade é o env-check.js, que roda antes de compilar; aqui
        # é só para o registro do build mostrar o resultado final.
        #
        # Avisa em vez de falhar: o pacote passa pelo Hermes e vira bytecode, e
        # não quero derrubar um build bom por causa de como o Hermes guardou o
        # texto. O endereço não é segredo — a chave publicável é protegida por
        # RLS e o app é de código aberto —, mas mesmo assim só o domínio é
        # impresso, nunca a chave.
        run: |
          BUNDLE=$(unzip -p "${{ steps.apk.outputs.name }}.apk" assets/index.android.bundle 2>/dev/null | strings || true)
          if echo "$BUNDLE" | grep -qF "$(echo "$EXPO_PUBLIC_SUPABASE_URL" | sed 's|https://||')"; then
            echo "OK: o endereço do servidor está gravado dentro do APK."
          else
            echo "::warning::Não achei o endereço no pacote. Pode ser só o formato do Hermes — confira instalando."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 30
